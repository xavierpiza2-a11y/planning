<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="canoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e8540" />
      <stop offset="50%" stop-color="#237435" />
      <stop offset="100%" stop-color="#185627" />
    </linearGradient>
    <filter id="canoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#canoBg)" />

  <!-- Stylized leaf -->
  <g filter="url(#canoShadow)">
    <path
      d="M 145 375 C 135 270 215 150 380 130 C 375 295 255 375 145 375 Z"
      fill="#ffffff"
    />
    <!-- Leaf central vein and side ribs -->
    <path
      d="M 155 365 Q 260 260 340 170"
      stroke="#206930"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 245 275 L 305 235"
      stroke="#206930"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 220 295 L 255 290"
      stroke="#206930"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Clock badge at bottom right -->
  <g transform="translate(365, 365)">
    <!-- Clock circle face -->
    <circle cx="0" cy="0" r="80" fill="#e8f5e9" stroke="#1b5e20" stroke-width="18" />
    <!-- Center pivot -->
    <circle cx="0" cy="0" r="5" fill="#1b5e20" />
    <!-- Clock hands (indicating shift time: hour hand at 12, minute hand at 4/20min) -->
    <line x1="0" y1="0" x2="0" y2="-42" stroke="#1b5e20" stroke-width="16" stroke-linecap="round" />
    <line x1="0" y1="0" x2="35" y2="24" stroke="#1b5e20" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
