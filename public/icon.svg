<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="8" />

  <!-- Calendar Base Card -->
  <rect x="116" y="148" width="280" height="256" rx="36" fill="#ffffff" />
  
  <!-- Calendar Header Bar -->
  <path d="M 116 184 C 116 163.899 132.899 148 153 148 L 359 148 C 379.101 148 396 163.899 396 184 L 396 220 L 116 220 Z" fill="#15803d" />

  <!-- Calendar Rings / Pins -->
  <rect x="176" y="120" width="28" height="56" rx="14" fill="#facc15" />
  <rect x="308" y="120" width="28" height="56" rx="14" fill="#facc15" />

  <!-- Stylized leaf embedded inside the calendar -->
  <path d="M 256 250 C 316 250 348 290 338 350 C 278 350 246 310 256 250 Z" fill="url(#leaf)" />
  <path d="M 256 250 C 206 270 186 314 200 360 C 240 354 260 320 256 250 Z" fill="#16a34a" />
  <path d="M 256 250 L 256 366" stroke="#14532d" stroke-width="6" stroke-linecap="round" />

  <!-- Small Clock Badge on bottom right -->
  <circle cx="366" cy="376" r="48" fill="#166534" stroke="#ffffff" stroke-width="8" />
  <circle cx="366" cy="376" r="4" fill="#ffffff" />
  <polyline points="366,352 366,376 384,376" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
