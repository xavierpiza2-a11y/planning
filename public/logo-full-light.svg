<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="fullLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (size: 96x96, pos: 12, 12) -->
  <g transform="translate(12, 12)">
    <rect width="96" height="96" rx="24" fill="url(#fullLightBg)" />
    
    <!-- Stylized leaf -->
    <path
      d="M 28 72 C 26 52 41 29 72 25 C 71 56 48 72 28 72 Z"
      fill="#ffffff"
    />
    <path
      d="M 30 70 Q 50 50 65 33"
      stroke="#14532d"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 47 53 L 58 45"
      stroke="#14532d"
      stroke-width="2.8"
      stroke-linecap="round"
      fill="none"
    />
    
    <!-- Mini clock -->
    <g transform="translate(69, 69)">
      <circle cx="0" cy="0" r="15" fill="#f0fdf4" stroke="#166534" stroke-width="3.5" />
      <line x1="0" y1="0" x2="0" y2="-8" stroke="#166534" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="0" x2="6.5" y2="4.5" stroke="#166534" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Typography for Light Backgrounds -->
  <g transform="translate(124, 0)">
    <text x="0" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      <tspan fill="#0f172a">Cano</tspan>
      <tspan fill="#16a34a">Shift</tspan>
    </text>
    <text x="2" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="3" fill="#64748b">
      PLANNING D'ÉQUIPE
    </text>
  </g>
</svg>
